services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraudgraph-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fraudgraph.db
      - CRITICAL_RISK_THRESHOLD=80
      - HIGH_RISK_THRESHOLD=60
      - MEDIUM_RISK_THRESHOLD=35
    volumes:
      - ./backend/fraudgraph.db:/app/fraudgraph.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraudgraph-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: fraudgraph-network

